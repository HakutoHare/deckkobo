# 遊戯王カードWiki の決まりと、新しいカードの載り方の確認用（一時的）
name: wiki-probe
on:
  push:
    paths: [".github/workflows/wiki-probe.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, time
          UA = "Mozilla/5.0 (deckkobo check; github.com/HakutoHare/deckkobo)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30); b = r.read()
                  for enc in [r.headers.get_content_charset(), "euc-jp", "utf-8"]:
                      if not enc: continue
                      try: return r.status, b.decode(enc)
                      except Exception: pass
                  return r.status, b.decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)
          def txt(p):
              p = re.sub(r"<script.*?</script>|<style.*?</style>", " ", p, flags=re.S)
              return [x for x in (re.sub(r"\s+", " ", y).strip() for y in html.unescape(re.sub(r"<[^>]+>", "\n", p)).split("\n")) if len(x) > 1]
          st, top = get("https://yugioh-wiki.net/")
          print("TOP", st)
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', top, re.S):
              t = html.unescape(re.sub(r"<[^>]+>", "", m.group(2))).strip()
              if t and len(t) < 40: print("LINK:", t, "|", html.unescape(m.group(1))[:120])
          def page(name):
              time.sleep(3); u = "https://yugioh-wiki.net/index.php?" + urllib.parse.quote(name.encode("euc-jp","replace"))
              st, p = get(u); ls = txt(p); print("=" * 70); print("PAGE:", name, st, "lines", len(ls)); return ls
          KEY = r"自動|ロボット|クロール|クローラ|スクレイピング|収集|機械的|プログラム|転載|複製|二次利用|無断|著作|ライセンス|GFDL|クリエイティブ|CC BY|禁止|負荷|アクセス"
          for n in ["はじめにお読み下さい"]:
              ls = page(n); k = 0
              for x in ls:
                  if re.search(KEY, x) and k < 25: print("  >", x[:300]); k += 1
          for n in ["《沈黙の闘者》", "ORIGINAL ARTWORK COLLECTION", "オリジナルアートワークコレクション"]:
              ls = page(n); print("\n".join("  : " + x[:200] for x in ls[:60]))
          ls = page("RecentChanges"); print("\n".join("  : " + x[:120] for x in ls[:80]))
          ls = page("はじめにお読み下さい"); print("\n".join("  # " + x[:300] for x in ls[:200]))
