# 相場の自動取得ができるかの検証用（一時的）。各店舗の robots.txt と、カード名で検索したページを1件ずつ読んで結果をログに出す
name: price-probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/price-probe.yml", "tools-probe/**"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, time
          UA = "Mozilla/5.0 (deckkobo price check; contact via github.com/HakutoHare/deckkobo)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "ja"}), timeout=30)
                  b = r.read(); enc = r.headers.get_content_charset() or "utf-8"
                  return r.status, r.geturl(), b.decode(enc, "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), u, str(e)
          q = "灰流うらら"; Q = urllib.parse.quote(q)
          shops = {
            "カーナベル": ("https://www.ka-nabell.com", [f"https://www.ka-nabell.com/?act=sell_search&genre=1&key_word={Q}", f"https://www.ka-nabell.com/sp/?act=sell_search&genre=1&key_word={Q}"]),
            "遊々亭": ("https://yuyu-tei.jp", [f"https://yuyu-tei.jp/sell/ygo/s/search?search_word={Q}"]),
            "カードラッシュ": ("https://www.cardrush.jp", [f"https://www.cardrush.jp/product-list?keyword={Q}"]),
            "ドラスタ": ("https://dorasuta.jp", [f"https://dorasuta.jp/yugioh/product-list?kw={Q}"]),
          }
          for name, (base, urls) in shops.items():
              print("=" * 70); print("■", name)
              st, fu, t = get(base + "/robots.txt")
              print("robots.txt:", st); print("\n".join(t.splitlines()[:40]))
              for u in urls:
                  time.sleep(3)
                  st, fu, t = get(u)
                  title = re.search(r"<title[^>]*>(.*?)</title>", t, re.S)
                  print("-" * 40); print("URL:", u); print("status:", st, "final:", fu, "size:", len(t)); print("title:", html.unescape(title.group(1).strip())[:120] if title else None)
                  txt = re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S)
                  txt = html.unescape(re.sub(r"<[^>]+>", " ", txt)); txt = re.sub(r"\s+", " ", txt)
                  print("うらら含む:", txt.count(q))
                  hits = [m.start() for m in re.finditer(r"[0-9,]{2,7}\s*円|¥\s*[0-9,]{2,7}", txt)]
                  print("値段らしき箇所:", len(hits))
                  for h in hits[:12]:
                      print("  …", txt[max(0, h-60):h+20])
                  # 値段の周りの HTML の作り（クラス名）を少しだけ
                  for m in list(re.finditer(r"(?:[0-9,]{2,7}\s*円|¥\s*[0-9,]{2,7})", t))[:3]:
                      print("  HTML:", re.sub(r"\s+", " ", t[max(0, m.start()-200):m.end()+30]))
