# 遊戯王カードWiki から指定カードを読み込む（一時的）
name: wiki-cards
on:
  push:
    paths: [".github/workflows/wiki-cards.yml"]
permissions: {contents: read}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        shell: python
        run: |
          import urllib.request, urllib.parse
          UA = "Mozilla/5.0 (deckkobo; github.com/HakutoHare/deckkobo)"
          pg = "《カオス・ソルジャー》（通常モンスター）"
          u = "https://yugioh-wiki.net/index.php?cmd=source&page=" + urllib.parse.quote(pg.encode("euc-jp"))
          b = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30).read().decode("utf-8", "replace")
          i = b.find("<pre"); print("\n".join(b[i:].split("\n")[:15]))
