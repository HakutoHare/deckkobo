# TCGplayer と Cardmarket の自動取得に関する決まりの確認用（一時的）
name: terms-probe2
on:
  push:
    paths: [".github/workflows/terms-probe2.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, time
          UA = "Mozilla/5.0 (deckkobo terms check; github.com/HakutoHare/deckkobo)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "en"}), timeout=30)
                  return r.status, r.geturl(), r.read().decode(r.headers.get_content_charset() or "utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), u, str(e)
          KEY = r"scrap|crawl|robot|spider|automat|data min|harvest|bot\b|bots\b|extract|API|price data|reproduc"
          def show(u):
              time.sleep(2); st, fu, p = get(u)
              body = re.sub(r"<script.*?</script>|<style.*?</style>", " ", p, flags=re.S)
              body = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              lines = [re.sub(r"\s+", " ", x).strip() for x in body.split("\n")]; lines = [x for x in lines if len(x) > 3]
              print("=" * 70); print("PAGE:", u, "status", st, "final", fu, "lines", len(lines))
              n = 0
              for x in lines:
                  if re.search(KEY, x, re.I) and n < 25: print("  >", x[:400]); n += 1
              return p
          for site in ["https://www.tcgplayer.com", "https://www.cardmarket.com"]:
              st, fu, rb = get(site + "/robots.txt")
              print("#" * 70); print("ROBOTS", site, st); print("\n".join(rb.splitlines()[:60]))
          # 規約ページ（候補を順に）
          for u in ["https://www.tcgplayer.com/terms-of-service", "https://help.tcgplayer.com/hc/en-us/articles/205004807-Terms-of-Service",
                    "https://www.cardmarket.com/en/YuGiOh/MainPage/conditionsOfUse", "https://www.cardmarket.com/en/Magic/MainPage/conditionsOfUse",
                    "https://www.cardmarket.com/en/YuGiOh/MainPage/termsOfService"]:
              show(u)
