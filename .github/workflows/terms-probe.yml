# カードラッシュの利用規約の確認用（一時的）。トップページから規約らしいページを探し、自動取得・転載などに関わる文だけをログに出す
name: terms-probe
on:
  push:
    paths: [".github/workflows/terms-probe.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, time
          UA = "Mozilla/5.0 (deckkobo terms check; github.com/HakutoHare/deckkobo)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30)
                  return r.status, r.read().decode(r.headers.get_content_charset() or "utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)
          base = "https://www.cardrush.jp"
          st, top = get(base + "/")
          print("top:", st, len(top))
          links = set()
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', top, re.S):
              txt = html.unescape(re.sub(r"<[^>]+>", "", m.group(2))).strip()
              if re.search(r"規約|ご利用|利用|特定商取引|ガイド|terms|guide|policy", txt + m.group(1), re.I):
                  links.add((urllib.parse.urljoin(base, m.group(1)), txt[:40]))
          for u, t in sorted(links): print("LINK:", t, u)
          KEY = r"自動|ロボット|クロール|クローラ|スクレイピング|収集|機械的|プログラム|転載|複製|二次利用|無断|著作|価格情報|情報の利用|禁止"
          seen = 0
          for u, t in sorted(links):
              if seen >= 6: break
              time.sleep(3); st, p = get(u); seen += 1
              body = re.sub(r"<script.*?</script>|<style.*?</style>", " ", p, flags=re.S)
              body = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              lines = [re.sub(r"\s+", " ", x).strip() for x in body.split("\n")]
              lines = [x for x in lines if x]
              print("=" * 70); print("PAGE:", t, u, "status", st, "lines", len(lines))
              for i, x in enumerate(lines):
                  if re.search(KEY, x):
                      print("  [%d] %s" % (i, x[:300]))
