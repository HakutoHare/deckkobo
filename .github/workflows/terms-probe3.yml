# 公式カードデータベースと遊戯王カードWiki の利用の決まりの確認用（一時的）
name: terms-probe3
on:
  push:
    paths: [".github/workflows/terms-probe3.yml"]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: python
        run: |
          import urllib.request, urllib.parse, re, html, time
          UA = "Mozilla/5.0 (deckkobo terms check; github.com/HakutoHare/deckkobo)"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "ja"}), timeout=30)
                  b = r.read(); cs = r.headers.get_content_charset()
                  for enc in [cs, "utf-8", "euc-jp", "shift_jis"]:
                      if not enc: continue
                      try: return r.status, r.geturl(), b.decode(enc)
                      except Exception: pass
                  return r.status, r.geturl(), b.decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), u, str(e)
          KEY = r"自動|ロボット|クロール|クローラ|スクレイピング|収集|機械的|プログラム|転載|複製|二次利用|無断|著作|営利|商用|引用|禁止|利用規約|ライセンス|GFDL|クリエイティブ|CC BY"
          def lines_of(p):
              body = re.sub(r"<script.*?</script>|<style.*?</style>", " ", p, flags=re.S)
              body = html.unescape(re.sub(r"<[^>]+>", "\n", body))
              return [x for x in (re.sub(r"\s+", " ", y).strip() for y in body.split("\n")) if len(x) > 2]
          def links_of(base, p, pat):
              out = []
              for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', p, re.S):
                  t = html.unescape(re.sub(r"<[^>]+>", "", m.group(2))).strip()
                  if re.search(pat, t + " " + m.group(1)): out.append((urllib.parse.urljoin(base, html.unescape(m.group(1))), t[:40]))
              return list(dict.fromkeys(out))
          def show(u, label):
              time.sleep(3); st, fu, p = get(u); ls = lines_of(p)
              print("=" * 70); print("PAGE:", label, u, "status", st, "final", fu, "lines", len(ls)); n = 0
              for x in ls:
                  if re.search(KEY, x) and n < 40: print("  >", x[:350]); n += 1
              return p
          for base, top in [("https://www.db.yugioh-card.com", "https://www.db.yugioh-card.com/yugiohdb/?request_locale=ja"), ("https://yugioh-wiki.net", "https://yugioh-wiki.net/")]:
              print("#" * 70); st, fu, rb = get(base + "/robots.txt"); print("ROBOTS", base, st); print("\n".join(rb.splitlines()[:50]))
              time.sleep(3); st, fu, p = get(top); print("TOP", top, st, fu, len(p))
              ls = links_of(top, p, r"規約|利用|ご利用|ポリシー|免責|著作|サイトについて|当サイト|terms|policy|about")
              for u, t in ls[:20]: print("LINK:", t, u)
              for u, t in ls[:6]: show(u, t)
